<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forever Locked 💍</title>

<style>
body{
  margin:0;
  font-family:'Comic Sans MS',cursive;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}

.page{
  display:none;
  background:white;
  padding:35px;
  border-radius:30px;
  text-align:center;
  width:90%;
  max-width:420px;
  box-shadow:0 30px 60px rgba(0,0,0,.3);
}
.page.active{display:block}

h1{color:#ff2f68}

button{
  padding:12px 28px;
  font-size:16px;
  border-radius:30px;
  border:none;
  margin:10px;
  cursor:pointer;
}
.yes{background:#ff2f68;color:white}
.no{background:#ddd;position:absolute}

input{
  padding:10px;
  width:80%;
  border-radius:12px;
  border:1px solid #ccc;
}

/* hearts */
.heart{
  position:fixed;
  font-size:22px;
  animation:float 6s linear infinite;
}
@keyframes float{
  from{transform:translateY(100vh);opacity:1}
  to{transform:translateY(-10vh);opacity:0}
}

/* popup */
.popup{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#ff2f68;
  color:white;
  padding:14px 22px;
  border-radius:25px;
  animation:fade 3s forwards;
}
@keyframes fade{to{opacity:0}}

/* celebration */
#celebrate{
  position:fixed;
